name: Docker image

# Pushing a tag vX.Y.Z[-pre] publishes ghcr.io/<owner>/deepseek-harness:X.Y.Z[-pre]
# for amd64 and arm64. Pushes to main and pull requests only build and test.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/deepseek-harness

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha

      # Build for this runner and check that dsh starts and the launcher picks
      # up its launch token, before anything is published.
      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: dsh-smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name dsh --tmpfs /data:uid=1000,gid=1000 \
            -e DSH_HOME=/data/home -e HOME=/data/home -e DSH_TELEMETRY_MODE=DISABLED \
            -p 8080:8080 dsh-smoke-test
          for _ in $(seq 60); do
            if docker logs dsh 2>&1 | grep -q 'dsh is ready'; then
              curl -fsS -o /dev/null -w 'GET / -> %{http_code}\n' http://127.0.0.1:8080/ || true
              docker logs dsh
              exit 0
            fi
            sleep 2
          done
          docker logs dsh
          echo "dsh did not become ready" >&2
          exit 1

      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        if: startsWith(github.ref, 'refs/tags/v')
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for tag in $(echo "${{ steps.meta.outputs.tags }}"); do
            echo "$tag@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
