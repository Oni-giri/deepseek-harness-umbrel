name: Docker image

# Pushing a tag v<dsh version> publishes ghcr.io/<owner>/deepseek-harness:<dsh version>
# for amd64 and arm64, then points the app in the Umbrel app store at it. Tag a
# rebuild of the same dsh version (e.g. a launcher change) v<dsh version>-<n>.
# Pushes to main and pull requests only build and test. update.yml creates the
# tags when dsh publishes a new release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/deepseek-harness

jobs:
  image:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha

      # Build for this runner and test it end to end before anything is
      # published: see test/smoke.mjs for what is checked.
      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: dsh-smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          data="$RUNNER_TEMP/data" work="$RUNNER_TEMP/work"
          mkdir -p "$data" "$work" && sudo chown 1000:1000 "$data" && chmod 777 "$work"
          # Same environment as the Umbrel app's docker-compose.yml.
          docker run -d --name dsh --init -v "$data:/data" -w /data \
            -e DATA_DIR=/data -e DSH_HOME=/data/home -e HOME=/data/home \
            -e DSH_WORKSPACE=/data/workspace -e LISTEN_PORT=8080 -e DSH_PORT=3081 \
            -e DSH_TELEMETRY_MODE=DISABLED dsh-smoke-test
          smoke() {
            docker run --rm --network container:dsh -v "$PWD/test:/test:ro" -v "$work:/work" \
              -e COOKIE_FILE=/work/cookie dsh-smoke-test node /test/smoke.mjs "$1"
          }
          trap 'docker logs dsh' EXIT
          smoke fresh
          sudo test -f "$data/home/.credentials.yaml" || { echo "FAIL dsh's credentials file is not in the data folder"; exit 1; }
          docker restart dsh
          smoke restart

      # As the agent's shell and dsh's terminal would: uid 1000, no root, HOME
      # on the data volume.
      - name: Agent tooling
        run: |
          data="$RUNNER_TEMP/data"
          docker run --rm -v "$data:/data" -e HOME=/data/home dsh-smoke-test bash -euo pipefail -c '
            git --version && python3 --version && rg --version | head -1
            echo "pnpm $(pnpm --version) via corepack"
            npm install -g --no-audit --no-fund semver > /dev/null
            pip install -q --no-warn-script-location pyjokes
            pnpm add -g --silent rimraf
            for bin in semver pyjoke; do
              [ "$(command -v "$bin")" = "/data/home/.local/bin/$bin" ] || { echo "FAIL $bin is not in ~/.local/bin"; exit 1; }
            done
            [ "$(command -v rimraf)" = /data/home/.local/share/pnpm/bin/rimraf ] || { echo "FAIL pnpm global bin is not in ~/.local/share/pnpm/bin"; exit 1; }
            [ "$(bash -lc "command -v semver")" = /data/home/.local/bin/semver ] || { echo "FAIL a login shell loses ~/.local/bin"; exit 1; }
            echo "ok   npm, pnpm and pip global installs land in ~/.local, also on a login shell PATH"
          '
          sudo test -x "$data/home/.local/bin/semver" || { echo "FAIL installs did not persist on the data volume"; exit 1; }

      # Installers that need no root keep their tools in the home folder and add
      # a PATH line to ~/.profile or ~/.bashrc. The agent's next command, a
      # fresh non-interactive `bash -c`, must find them through BASH_ENV.
      - name: Home installers
        run: |
          data="$RUNNER_TEMP/data"
          sudo test -f "$data/home/.bashrc" || { echo "FAIL the launcher did not create ~/.bashrc"; exit 1; }
          run() { docker run --rm -v "$data:/data" -e HOME=/data/home dsh-smoke-test bash -c "$1"; }
          run 'curl -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal'
          run 'curl -sSf https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash > /dev/null && . ~/.nvm/nvm.sh && nvm install --no-progress 20 > /dev/null'
          run 'set -euo pipefail
            cargo --version && rustc --version
            echo "nvm $(nvm --version)"
            case "$(node --version)" in v20.*) ;; *) echo "FAIL node is not nvm'"'"'s 20"; exit 1 ;; esac
            echo "ok   rustup and nvm tools work in a fresh non-interactive shell"'

      - name: Release checks
        run: |
          # The app turns telemetry off with DSH_TELEMETRY_MODE; if dsh stops
          # reading it, telemetry would silently come back on.
          docker run --rm dsh-smoke-test grep -rqF DSH_TELEMETRY_MODE /opt/dsh/node_modules/@deepseek-ai \
            || { echo "FAIL dsh no longer reads DSH_TELEMETRY_MODE"; exit 1; }
          echo "ok   dsh still reads DSH_TELEMETRY_MODE"
          # Registry signatures (and provenance, where published) of every package.
          docker run --rm -e HOME=/tmp -w /opt/dsh dsh-smoke-test npm audit signatures

      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        if: startsWith(github.ref, 'refs/tags/v')
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for tag in $(echo "${{ steps.meta.outputs.tags }}"); do
            echo "$tag@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Point the app at the new image: compose image@digest, app version and
  # release notes. Needs APP_STORE_TOKEN, a fine-grained token with Contents
  # read and write on the app store repository only.
  app-store:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/yakitoris-app-store
          ref: master
          token: ${{ secrets.APP_STORE_TOKEN }}
          path: app-store

      - name: Update the app
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ needs.image.outputs.version }}@${{ needs.image.outputs.digest }}
        run: |
          dsh_version=$(node -p 'require("./package.json").dependencies["@deepseek-ai/dsh"]')
          # An annotated tag's message becomes the app's release notes.
          git fetch -q --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes=$(git for-each-ref --format='%(if)%(*objectname)%(then)%(contents)%(end)' "refs/tags/$GITHUB_REF_NAME")
          python3 scripts/update-app-store.py app-store/yakitori-deepseek-harness \
            "${IMAGE_REF,,}" "$dsh_version" "$notes"

      - name: Commit and push
        working-directory: app-store
        run: |
          if git diff --quiet; then echo "The app already uses this image."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' yakitori-deepseek-harness/umbrel-app.yml)
          git commit -qam "DeepSeek Harness: update to $version" \
            -m "Published by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin HEAD:master
          echo "Pushed DeepSeek Harness $version to the app store" >> "$GITHUB_STEP_SUMMARY"
